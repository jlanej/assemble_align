[package]
name = "copyproof-engine"
version = "0.1.0"
edition = "2021"
description = "k-mer engine for copyproof: sampled k-mer counting and positional lookup along assemblies"
license = "MIT"

[[bin]]
name = "cpk"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"
crossbeam-channel = "0.5"
memchr = "2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
